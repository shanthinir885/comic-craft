<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Export Successful — ComicCraft</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f4f2fb;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
      padding: 40px;
      text-align: center;
      max-width: 420px;
    }
    h1 { color: #2c2450; }
    p { color: #555; }
    a {
      display: inline-block;
      margin-top: 20px;
      background: #5b3df5;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { background: #4630c9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Your comic is ready! 🎉</h1>
    <p>Your PDF has been generated successfully.</p>
    {% if pdf_path %}
      <p style="font-size: 0.85rem; color: #999;">{{ pdf_path }}</p>
    {% endif %}
    <a href="/">Create Another Comic</a>
  </div>
</body>
</html>
